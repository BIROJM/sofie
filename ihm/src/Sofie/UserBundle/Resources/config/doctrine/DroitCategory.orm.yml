Sofie\UserBundle\Entity\DroitCategory:
    type: entity
    table: t_droitcategory
    repositoryClass: Sofie\UserBundle\Entity\DroitCategoryRepository
    uniqueConstraints:
        libelle:
            columns:
                - libelle
    gedmo:
        soft_deleteable:
            field_name: deletedAt
            time_aware: false
    id:
        id:
            type: integer
            id: true
            generator:
                strategy: NONE
    fields:
        libelle:
            type: string
            length: '50'
            nullable: true
        description:
            type: string
            nullable: true
            length: 255
        deletedAt:
            type: datetime
            nullable: true
            column: deleted_at
        sync:
            type: string
            nullable: true
            length: '1'
            options:
                default: 'N'
    oneToMany:
        droits:
            targetEntity: Droit
            cascade: ["persist"]
            mappedBy: droitCategory
            fetch: EXTRA_LAZY
    lifecycleCallbacks:
        preUpdate: [setUpdatedValue]
