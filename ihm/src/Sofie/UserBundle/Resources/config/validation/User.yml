Sofie\UserBundle\Entity\User:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity: username
    properties:
        email:
            - Email: ~
        username:
            - NotBlank: ~
            - Length:
                min: 3
            - Regex:
                pattern: "/^[a-z]\w+$/i"
        plainPassword:
            - Length:
                min: 6