Sofie\ExpBundle\Entity\VenuEauPrincipale:
    type: entity
    table: t_venueauprincipale
    repositoryClass: Sofie\ExpBundle\Entity\VenuEauPrincipaleRepository
    gedmo:
        soft_deleteable:
            field_name: deletedAt
            time_aware: false
    id:
        id:
            type: integer
            id: true
            column: IDVenueauprincipale
            nullable: false
            generator:
                strategy: NONE
    fields:
        profondeur:
            type: decimal
            precision: 8
            scale: 2
            nullable: true
            column: Profondeur
        debitCumule:
            type: decimal
            precision: 8
            scale: 2
            nullabel: true
            column: DebitCumule
        sync:
            type: string
            length: 1
            nullable: true
            options:
                default: 'N'
            column: `sync`
        deletedAt:
            type: datetime
            nullable: true
            column: deleted_at
        createdAt:
            type: datetime
            nullable: true
            column: created_at
        updatedAt:
            type: datetime
            nullable: true
            column: updated_at
    manyToOne:
        ouvrage:
            targetEntity: Ouvrage
            cascade: ["persist"]
            inversedBy: venuEauPrincipales
            joinColumn:
                name: IDOuvrage
                nullable: true
                referencedColumnName: IDOuvrage
                onDelete: "CASCADE"
            orphanRemoval: true
    lifecycleCallbacks:
        prePersist: [setCreatedValue, setCustomId]
        preUpdate: [setUpdatedValue]
        preFlush: [setPreFlushValue]
        preRemove: [setRemovedValue]

