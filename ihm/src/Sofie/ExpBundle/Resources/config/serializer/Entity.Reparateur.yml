Sofie\ExpBundle\Entity\Reparateur:
    exclusion_policy: ALL
    properties:
        nom:
            expose: true
            serialized_name: NomRep
            groups: [api_add]
        prenoms:
            expose: true
            serialized_name: PrenomsRep
            groups: [api_add]
        codeInit:
            expose: true
            serialized_name: CodeInitRep
            groups: [api_add]
        initStatus:
            expose: true
            serialized_name: InitSatus
            groups: [api_add]
        sync:
            expose: true
            serialized_name: sync
            groups: [api_add]
        createdAt:
            expose: true
            serialized_name: created_at
            groups: [api_add]
            type: DateTime<'Y-m-d H:i:s'>
        updatedAt:
            expose: true
            serialized_name: updated_at
            groups: [api_add]
            type: DateTime<'Y-m-d H:i:s'>
