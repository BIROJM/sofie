Sofie\ExpBundle\Entity\Localite:
    exclusion_policy: ALL
    properties:
        nom:
            expose: true
            serialized_name: NomLocalite
            groups: [api_add]
        nombreHabitant:
            expose: true
            serialized_name: NombreHabitant
            groups: [api_add]
        sync:
            expose: true
            serialized_name: sync
            groups: [api_add]
        createdAt:
            expose: true
            serialized_name: created_at
            groups: [api_add]
            type: DateTime<'Y-m-d H:i:s'>
        updatedAt:
            expose: true
            serialized_name: updated_at
            groups: [api_add]
            type: DateTime<'Y-m-d H:i:s'>
        region:
            expose: true
            serialized_name: IDRegion
            groups: [api_add]
            type: integer
            max_depth: 1
            accessor:
                getter: getRegionId
        reparateur:
            expose: true
            serialized_name: IDReparateur
            groups: [api_add]
            type: integer
            max_depth: 1
            accessor:
                getter: getReparateurId
        agentForma:
            expose: true
            serialized_name: IDAgentForma
            groups: [api_add]
            type: integer
            max_depth: 1
            accessor:
                getter: getAgentFormaId
